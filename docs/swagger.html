<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thingsFinder API</title>
<!--
  Swagger UI for openapi.yaml in this folder. It loads the spec over HTTP, so
  serve the repo (`composer serve`, i.e. `php -S localhost:8000 -t web router.php`) and open
  http://localhost:8000/docs/swagger.html — opening the file directly from
  disk won't work in most browsers. Only the dev router serves docs/; it's
  outside web/, so Apache deployments don't expose it.
-->
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>body { margin: 0; background: #fff; }</style>
</head>
<body>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  window.ui = SwaggerUIBundle({
    url: 'openapi.yaml',
    dom_id: '#swagger-ui',
    deepLinking: true,
    persistAuthorization: true,
  });
</script>
</body>
</html>
