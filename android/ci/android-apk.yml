# Builds the Android app in android/ and publishes the debug APK as a
# downloadable artifact on every push (and on demand from the Actions tab).
name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: thingsfinder-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: android/app/build/reports/tests/
